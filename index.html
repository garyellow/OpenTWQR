  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenTWQR" />
    <meta property="og:description" content="產生 TWQR 個人收款 QR Code，對方用銀行 App 掃碼即可轉帳。完全免費、無需註冊。" />
    <meta property="og:url" content="https://pay.garyellow.app/" />
    <meta property="og:image" content="https://pay.garyellow.app/screenshots/receive-mobile-light.png" />
    <meta property="og:image:width" content="1290" />
    <meta property="og:image:height" content="2796" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenTWQR" />
    <meta name="twitter:description" content="產生 TWQR 個人收款 QR Code，對方用銀行 App 掃碼即可轉帳。完全免費、無需註冊。" />
    <meta name="twitter:image" content="https://pay.garyellow.app/screenshots/receive-mobile-light.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('opentwqr-theme') || '{}');
          var m = (s.state && s.state.mode) || 'system';
          var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) {
            document.documentElement.classList.add('dark');
            document.querySelectorAll('meta[name="theme-color"]').forEach(function(el) {
              el.content = '#0c0c0e';
            });
          }
          // Apply accent hue from persisted store
          var hue = (s.state && s.state.accentHue) || 216;
          var r = document.documentElement.style;
          r.setProperty('--accent-hue', String(hue));
          r.setProperty('--accent', 'oklch(55% 0.15 ' + hue + ')');
          r.setProperty('--accent-hover', 'oklch(48% 0.15 ' + hue + ')');
          r.setProperty('--accent-light', 'oklch(95% 0.04 ' + hue + ')');
          r.setProperty('--accent-subtle', 'oklch(90% 0.06 ' + hue + ')');
          r.setProperty('--accent-dark', 'oklch(75% 0.12 ' + hue + ')');
          r.setProperty('--accent-dark-hover', 'oklch(80% 0.12 ' + hue + ')');
          r.setProperty('--accent-dark-light', 'oklch(25% 0.04 ' + hue + ')');
          r.setProperty('--accent-dark-subtle', 'oklch(30% 0.06 ' + hue + ')');
        } catch (e) {}
      })();
    </script>
    <!--
      Restore URL encoded by 404.html for SPA routing on GitHub Pages.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
