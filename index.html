<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>OpenTWQR</title>
    <meta name="description" content="在裝置本地安全產生台灣 Pay（TWQR）個人收款 QR Code。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenTWQR" />
    <meta property="og:description" content="在裝置本地安全產生台灣 Pay（TWQR）個人收款 QR Code。" />
    <meta property="og:image" content="/screenshots/receive-light.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('opentwqr-theme') || '{}');
          var m = (s.state && s.state.mode) || 'system';
          var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) {
            document.documentElement.classList.add('dark');
            // Update both theme-color meta tags for dark mode
            document.querySelectorAll('meta[name="theme-color"]').forEach(function(el) {
              el.content = '#09090b';
            });
          }
        } catch (e) {}
      })();
    </script>
    <!--
      Restore URL encoded by 404.html for SPA routing on GitHub Pages.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
