<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>OpenTWQR</title>
    <!--
      SPA redirect for GitHub Pages.
      When GitHub Pages serves a 404 for a client-side route (e.g. /accounts),
      this script encodes the intended path into the query string and redirects to the
      app root, where index.html decodes it back via history.replaceState.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      // seg = 0: site is served at root (custom domain), no repo-name prefix to skip.
      var seg = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
