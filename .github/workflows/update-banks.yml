name: Update Bank List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: update-bank-list
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-banks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update bank dataset
        run: bun run update:banks

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No bank data changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/banks.generated.ts public/data/banks.latest.json
          git commit -m "chore(data): update bank list from official source"
          git push
