name: Update Bank List

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: update-bank-list
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-banks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update bank dataset
        run: npm run update:banks

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No bank data changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/banks.generated.ts public/data/banks.latest.json
          git commit -m "chore(data): update bank list from official source"
          git push
